name: Test environment

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-environment:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create Python 3.11 environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-model-training.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-model-training.txt

      - name: Verify imports
        run: |
          python -c "import torch, torch_geometric, rdkit, yaml, sklearn, numpy, matplotlib, tqdm, wandb, torchinfo; print('torch', torch.__version__); print('pyg', torch_geometric.__version__)"
